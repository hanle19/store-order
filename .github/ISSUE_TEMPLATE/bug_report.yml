name: 缺陷报告 / Bug report
description: 报告一个可复现的系统缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现信息，便于我们定位问题。
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 部署方式（Windows 一键 / 手动 / Docker）、版本号、浏览器
      placeholder: 例如 v5.0.0，Docker 部署，Chrome 120
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步描述如何触发问题
      placeholder: |
        1. 进入 xxx 页面
        2. 点击 xxx
        3. 出现 xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么（含报错信息）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 后端日志 server/logs/ 或浏览器控制台报错。注意脱敏，勿泄露客户 / 订单真实数据。
    validations:
      required: false
